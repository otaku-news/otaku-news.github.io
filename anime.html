<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://graphql.anilist.co" crossorigin>
<link rel="preconnect" href="https://s4.anilist.co" crossorigin>
<link rel="dns-prefetch" href="https://i.ytimg.com">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading… — Otaku News</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="account.css">
<style>
  /* ---------- Anime detail page (Crunchyroll-style) ---------- */
  .detail-wrap { max-width: 1080px; margin: 0 auto; padding: 0 0 64px; }
  .back-link {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 13px; font-weight: 600; color: var(--ink-soft);
    margin: 14px 20px; transition: color .15s;
  }
  .back-link:hover { color: var(--accent); }

  .cr-hero {
    position: relative; overflow: hidden;
    background-size: cover; background-position: center;
    border-radius: 0 0 22px 22px;
  }
  .cr-hero::before {
    content: ""; position: absolute; inset: 0;
    background: rgba(16, 12, 14, .78);
    backdrop-filter: blur(14px);
  }
  .cr-hero-inner {
    position: relative; z-index: 2;
    display: flex; gap: clamp(14px, 3vw, 28px);
    padding: clamp(18px, 4vw, 36px) clamp(16px, 3vw, 32px);
    align-items: center;
  }
  .cr-poster {
    width: clamp(96px, 17vw, 170px); flex-shrink: 0;
    border-radius: 10px; box-shadow: 0 16px 40px rgba(0,0,0,.5);
  }
  .cr-info { min-width: 0; color: #fff; }
  .cr-title {
    font-size: clamp(18px, 3.4vw, 32px); font-weight: 800;
    letter-spacing: -.6px; line-height: 1.12; color: #fff;
  }
  .cr-native { font-family: var(--mono); font-size: clamp(9px, 1.2vw, 11.5px); color: rgba(255,255,255,.55); margin-top: 5px; }
  .cr-score-row { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
  .cr-stars { color: #ffb02e; font-size: clamp(12px, 1.6vw, 15px); letter-spacing: 1px; }
  .cr-score-num { font-weight: 800; font-size: clamp(12.5px, 1.6vw, 15px); color: #fff; }
  .cr-score-cnt { font-family: var(--mono); font-size: clamp(9px, 1.1vw, 10.5px); color: rgba(255,255,255,.5); }
  .cr-meta-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .cr-pill {
    font-family: var(--mono); font-size: clamp(8.5px, 1vw, 10px); font-weight: 700;
    letter-spacing: .5px; text-transform: uppercase;
    color: rgba(255,255,255,.85); border: 1px solid rgba(255,255,255,.25);
    border-radius: 100px; padding: 4px 11px;
  }
  .cr-cta-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; align-items: center; }
  .cr-cta {
    display: inline-flex; align-items: center; gap: 8px;
    background: linear-gradient(100deg, var(--accent), #ff8a5c);
    color: #fff; font-weight: 800; font-size: clamp(12px, 1.5vw, 14px);
    padding: 11px 22px; border-radius: 8px;
    box-shadow: 0 8px 24px rgba(224,69,90,.4);
    transition: transform .18s cubic-bezier(.22,1,.36,1), filter .15s;
  }
  .cr-cta:hover { transform: translateY(-2px); filter: brightness(1.07); }
  .cr-hero .wl-wrap { margin-top: 0; }
  .cr-hero .wl-btn {
    background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.35); color: #fff;
    padding: 11px 20px; border-radius: 8px; font-size: clamp(12px, 1.5vw, 13.5px);
  }
  .cr-hero .wl-btn.on { background: linear-gradient(100deg, var(--accent), #ff8a5c); border-color: transparent; }

  .cr-body { padding: 22px clamp(16px, 3vw, 32px) 0; }
  .detail-section-label {
    font-family: var(--mono); font-size: clamp(9px, 1.1vw, 10.5px); letter-spacing: 2px;
    text-transform: uppercase; color: var(--ink-faint);
    margin: 24px 0 11px; display: flex; align-items: center; gap: 8px;
  }
  .detail-section-label::before {
    content: ""; width: 7px; height: 7px; border-radius: 2px;
    background: var(--accent); transform: rotate(45deg); flex-shrink: 0;
  }
  .detail-desc { font-size: clamp(13px, 1.5vw, 14.5px); line-height: 1.7; color: var(--ink-soft); max-width: 720px; }
  .detail-desc p + p { margin-top: 10px; }

  .cr-details {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 1px; background: var(--line); border: 1.5px solid var(--line);
    border-radius: 12px; overflow: hidden; max-width: 720px;
  }
  .cr-cell { background: var(--card); padding: 11px 14px; }
  .cr-cell .k { font-family: var(--mono); font-size: 8.5px; letter-spacing: 1px; text-transform: uppercase; color: var(--ink-faint); }
  .cr-cell .v { font-weight: 700; font-size: clamp(11px, 1.3vw, 12.5px); margin-top: 3px; color: var(--ink); }

  .next-ep {
    display: inline-flex; align-items: center; gap: 8px;
    border: 1.5px solid var(--accent); background: var(--accent-soft);
    border-radius: 100px; padding: 6px 13px;
    font-family: var(--mono); font-size: clamp(9px, 1.2vw, 11px); font-weight: 700; color: var(--accent);
  }
  .next-ep .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: pulse 1.6s infinite; }

  .char-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 12px; max-width: 720px; }
  .char { text-align: center; }
  .char img {
    width: clamp(44px, 6vw, 58px); height: clamp(44px, 6vw, 58px);
    border-radius: 50%; object-fit: cover;
    border: 2px solid var(--line); margin: 0 auto 6px;
    transition: transform .2s cubic-bezier(.22,1,.36,1), border-color .15s;
  }
  .char:hover img { transform: scale(1.08); border-color: var(--accent); }
  .char .cname { font-size: clamp(9px, 1.1vw, 10.5px); font-weight: 600; line-height: 1.3; }

  .detail-error { text-align: center; padding: 80px 20px; color: var(--ink-faint); font-family: var(--mono); }
  .detail-skel { height: 420px; margin: 16px; }

  @media (max-width: 560px) {
    .cr-cta-row .cr-cta, .cr-hero .wl-btn { padding: 9px 15px; }
    .cr-details { grid-template-columns: repeat(2, 1fr); }
  }
  </style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a href="index.html" class="logo">
      <span class="mark"><img src="logo.jpg" alt="Otaku News Logo" /></span>
      <span class="word">Otaku News<span class="jp">オタクニュース</span></span>
    </a>
    <div class="nav-actions">
      <button id="theme-toggle" title="Toggle theme (Light / Dark / Cyberpunk / Matrix / Synthwave)" aria-label="Toggle theme"><span class="ti-moon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></span><span class="ti-sun"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="4.9" y1="4.9" x2="7" y2="7"/><line x1="17" y1="17" x2="19.1" y2="19.1"/><line x1="2" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22" y2="12"/><line x1="4.9" y1="19.1" x2="7" y2="17"/><line x1="17" y1="7" x2="19.1" y2="4.9"/></svg></span><span class="ti-cyber">CYB</span><span class="ti-matrix">MAT</span><span class="ti-synth">SYN</span></button>
    </div>
  </div>
</nav>

<script type="module" src="firebase-init.js"></script>
<script src="anilist.js" defer></script>
<script src="features.js" defer></script>
<script src="account.js" defer></script>
<div class="detail-wrap">
  <a class="back-link" href="index.html#airing">← Back to Otaku News</a>
  <!-- account.js injects the Account button here when signed in -->

  <div id="detail-content">
    <div class="skeleton detail-skel"></div>
  </div>
</div>

<footer>
  OTAKU NEWS © 2026 — MADE WITH <span class="heart">♥</span> BY FANS, FOR FANS · RANCHI → TOKYO
</footer>

<script>
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  window.scrollTo(0, 0);
  window.addEventListener('load', () => window.scrollTo(0, 0));

  // ---------- Theme (shared with main page via same localStorage key) ----------
  const themeBtn = document.getElementById('theme-toggle');
  const root = document.documentElement;
  const themes = ['light', 'dark', 'cyberpunk'];
  function applyTheme(t) {
    if (!themes.includes(t)) t = 'light';
    root.setAttribute('data-theme', t);
    try { localStorage.setItem('otaku-theme', t); } catch (e) {}
    if (themeBtn) themeBtn.title = 'Theme: ' + t.charAt(0).toUpperCase() + t.slice(1) + ' (Click to change)';
  }
  let saved = null;
  try { saved = localStorage.getItem('otaku-theme'); } catch (e) {}
  applyTheme(saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
  if (themeBtn) themeBtn.addEventListener('click', () => {
    const current = root.getAttribute('data-theme') || 'light';
    const nextIdx = (themes.indexOf(current) + 1) % themes.length;
    applyTheme(themes[nextIdx]);
  });

  // ---------- Fetch & render anime details ----------
  const box = document.getElementById('detail-content');
  const id = parseInt(new URLSearchParams(location.search).get('id'), 10);

  const QUERY = `
    query ($id: Int) {
      Media(id: $id) {
        title { english romaji native }
        description(asHtml: false)
        averageScore meanScore popularity favourites
        stats { scoreDistribution { score amount } }
        genres format status episodes duration season seasonYear
        source studios(isMain: true) { nodes { name } }
        staff(perPage: 8, sort: RELEVANCE) { edges { role node { name { full } } } }
        startDate { year month day }
        bannerImage siteUrl
        coverImage { extraLarge large }
        trailer { id site }
        externalLinks { site type url color }
        relations { edges { relationType node { id type format title { english romaji } coverImage { large } seasonYear status } } }
        nextAiringEpisode { episode timeUntilAiring }
        characters(sort: ROLE, perPage: 6) {
          nodes { name { full } image { medium } }
        }
      }
    }`;

  function esc(s) {
    return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
  }

  function fail(msg) {
    box.innerHTML = `<div class="detail-error">⚠️ ${msg}<br><br><a class="back-link" href="index.html">← Back to the site</a></div>`;
  }

  if (!id) {
    fail('No anime specified.');
  } else {
    fetch('https://graphql.anilist.co', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify({ query: QUERY, variables: { id } })
    })
    .then(r => { if (!r.ok) throw 0; return r.json(); })
    .then(({ data }) => {
      const m = data.Media;
      const title = m.title.english || m.title.romaji;
      document.title = title + ' — Otaku News';

      const paras = (m.description || 'No synopsis available.')
        .replace(/<br\s*\/?>/gi, '\n').replace(/<[^>]*>/g, '')
        .split(/\n{2,}|\n/).filter(Boolean)
        .map(p => `<p>${esc(p)}</p>`).join('');

      const next = m.nextAiringEpisode;
      let nextHtml = '';
      if (next) {
        const s = next.timeUntilAiring;
        const d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), mn = Math.floor((s % 3600) / 60);
        nextHtml = `<div class="next-ep"><span class="dot"></span>EP ${next.episode} AIRS IN ${d > 0 ? d + 'D ' : ''}${h}H ${mn}M</div>`;
      }

      const date = m.startDate && m.startDate.year
        ? [m.startDate.year, m.startDate.month, m.startDate.day].filter(Boolean).join('-') : '—';
      const OTT_RANK = { 'Crunchyroll': 1, 'Netflix': 2, 'Prime Video': 3, 'Amazon Prime Video': 3, 'Hulu': 4, 'Disney Plus': 5, 'Max': 6, 'HIDIVE': 7 };
      const seenSites = new Set();
      const CREATOR_ROLES = ['Original Creator', 'Original Story', 'Story & Art', 'Story', 'Original Character Design'];
      let creator = null;
      for (const role of CREATOR_ROLES) {
        const hit = (m.staff.edges || []).find(e => (e.role || '').trim() === role);
        if (hit) { creator = hit.node.name.full; break; }
      }
      const streams = (m.externalLinks || []).filter(l => {
        if (l.type !== 'STREAMING' || seenSites.has(l.site)) return false;
        seenSites.add(l.site);
        return true;
      }).sort((x, y) => (OTT_RANK[x.site] || 99) - (OTT_RANK[y.site] || 99)).slice(0, 6);
      const watch = streams.length ? `<div class="detail-section-label">視聴 — Where to Watch</div>
        <div class="watch-row">${streams.map(l =>
          `<a class="watch-btn" href="${l.url}" target="_blank" rel="noopener" style="--brand:${l.color || 'var(--accent)'}">${l.site} ↗</a>`).join('')}</div>` : '';
      const trailer = m.trailer && m.trailer.site === 'youtube'
        ? `<a class="trailer-thumb" href="https://www.youtube.com/watch?v=${m.trailer.id}" target="_blank" rel="noopener">
             <img src="https://i.ytimg.com/vi/${m.trailer.id}/hqdefault.jpg" alt="Watch trailer on YouTube" loading="lazy">
             <span class="tt-overlay"><span class="tt-play">▶</span><span class="tt-label">Watch trailer on YouTube ↗</span></span>
           </a>`
        : `<a class="trailer-thumb" href="https://www.youtube.com/results?search_query=${encodeURIComponent(title + ' official trailer')}" target="_blank" rel="noopener">
             <img src="${m.coverImage.extraLarge || m.coverImage.large}" alt="Find trailer on YouTube" loading="lazy" style="object-position:top">
             <span class="tt-overlay"><span class="tt-play">▶</span><span class="tt-label">Find trailer on YouTube ↗</span></span>
           </a>`;

      const REL_LABEL = { PREQUEL: 'Prequel', SEQUEL: 'Sequel', SIDE_STORY: 'Side Story', SPIN_OFF: 'Spin-off', ALTERNATIVE: 'Alternative', PARENT: 'Parent Story', SUMMARY: 'Summary', SOURCE: 'Source' };
      const related = (m.relations.edges || [])
        .filter(e => e.node.type === 'ANIME' && REL_LABEL[e.relationType])
        .slice(0, 8);
      const relatedHtml = related.length ? `
        <div class="detail-section-label">シリーズ — Seasons &amp; Related</div>
        <div class="rel-row" id="rel-row">${related.map(e => `
          <a class="rel-card" href="anime.html?id=${e.node.id}">
            <img src="${e.node.coverImage.large}" alt="${(e.node.title.english || e.node.title.romaji).replace(/"/g, '&quot;')}" loading="lazy">
            <span class="rel-tag${e.node.status === 'NOT_YET_RELEASED' ? ' upcoming' : ''}">${e.node.status === 'NOT_YET_RELEASED' ? 'UPCOMING' : REL_LABEL[e.relationType]}</span>
            <span class="rel-name">${(e.node.title.english || e.node.title.romaji)}</span>
            <span class="rel-meta">${[e.node.format, e.node.seasonYear].filter(Boolean).join(' · ')}</span>
          </a>`).join('')}</div>` : '';
      const chars = (m.characters.nodes || []).map(c => `
        <div class="char">
          <img src="${c.image.medium}" alt="${esc(c.name.full)}" loading="lazy">
          <div class="cname">${esc(c.name.full)}</div>
        </div>`).join('');

      const exactScore = (() => {
        const d = m.stats && m.stats.scoreDistribution;
        if (d && d.length) {
          const t = d.reduce((s, x) => s + x.amount, 0);
          if (t) return d.reduce((s, x) => s + x.score * x.amount, 0) / t / 10;
        }
        return m.averageScore ? m.averageScore / 10 : null;
      })();
      const stars = exactScore ? '★'.repeat(Math.round(exactScore / 2)) + '☆'.repeat(5 - Math.round(exactScore / 2)) : '';
      const bg = m.bannerImage || m.coverImage.extraLarge || m.coverImage.large;
      const firstStream = (m.externalLinks || []).find(l => l.type === 'STREAMING');

      box.innerHTML = `
        <div class="cr-hero" style="background-image:url('${bg}')">
          <div class="cr-hero-inner">
            <img class="cr-poster" src="${m.coverImage.extraLarge || m.coverImage.large}" alt="${esc(title)} poster">
            <div class="cr-info">
              <h1 class="cr-title">${esc(title)}</h1>
              ${m.title.native ? `<div class="cr-native">${esc(m.title.native)}</div>` : ''}
              ${exactScore ? `<div class="cr-score-row">
                <span class="cr-stars">${stars}</span>
                <span class="cr-score-num">${exactScore.toFixed(2)}</span>
                <span class="cr-score-cnt">${m.popularity ? '(' + m.popularity.toLocaleString() + ' fans)' : ''}</span>
              </div>` : ''}
              <div class="cr-meta-row">
                ${[(m.format || '').replace(/_/g, ' '), m.episodes ? m.episodes + ' EPS' : null, m.season ? m.season + ' ' + m.seasonYear : null, (m.studios.nodes[0] || {}).name].filter(Boolean).map(x => `<span class="cr-pill">${esc(String(x))}</span>`).join('')}
              </div>
              <div class="cr-cta-row">
                ${firstStream ? `<a class="cr-cta" href="${firstStream.url}" target="_blank" rel="noopener">▶ Watch on ${esc(firstStream.site)}</a>` : `<a class="cr-cta" href="${m.siteUrl}" target="_blank" rel="noopener">View on AniList</a>`}
                ${window.otakuWLButton ? window.otakuWLButton(id, title, m.coverImage.large) : ''}
              </div>
            </div>
          </div>
        </div>
        <div class="cr-body">
          ${creator ? `<div class="review-author" style="border-top:none;padding-top:0;margin-top:0"><span class="author-tag">AUTHOR</span>${esc(creator)}</div>` : ''}
          <div class="detail-chips" style="margin-top:10px">${(m.genres || []).map(g => `<span class="genre-tag">${g}</span>`).join('')}</div>
          ${nextHtml ? `<div style="margin-top:14px">${nextHtml}</div>` : ''}
          ${watch}
          <div class="detail-section-label">あらすじ — Synopsis</div>
          <div class="detail-desc">${paras}</div>
          <div class="detail-section-label">詳細 — Details</div>
          <div class="cr-details">
            <div class="cr-cell"><div class="k">Favorites</div><div class="v">${m.favourites ? m.favourites.toLocaleString() : '—'}</div></div>
            <div class="cr-cell"><div class="k">Runtime</div><div class="v">${m.duration ? m.duration + ' min' : '—'}</div></div>
            <div class="cr-cell"><div class="k">Premiered</div><div class="v">${date}</div></div>
            <div class="cr-cell"><div class="k">Source</div><div class="v">${(m.source || '—').replace(/_/g, ' ')}</div></div>
            <div class="cr-cell"><div class="k">Status</div><div class="v">${(m.status || '—').replace(/_/g, ' ')}</div></div>
            <div class="cr-cell"><div class="k">AniList</div><div class="v"><a href="${m.siteUrl}" target="_blank" rel="noopener" style="color:var(--accent)">Open ↗</a></div></div>
          </div>
          ${relatedHtml}
          ${chars ? `<div class="detail-section-label">キャラクター — Characters</div><div class="char-row">${chars}</div>` : ''}
          <div class="detail-section-label">予告編 — Trailer</div>${trailer}
          ${window.otakuComments ? window.otakuComments(id, title) : ''}
        </div>`;
      if (window.otakuCommentsRefresh) window.otakuCommentsRefresh(id);
      expandFranchise(m);
    })
    .catch(() => fail("Couldn't load this anime. The AniList API may be busy — try refreshing."));
  }

  // Walk the WHOLE franchise chain (all seasons), not just direct neighbours
  const FR_TYPES = ['PREQUEL', 'SEQUEL', 'PARENT', 'SIDE_STORY', 'SPIN_OFF', 'ALTERNATIVE'];
  const FR_Q = `query($ids:[Int]){Page(perPage:25){media(id_in:$ids,type:ANIME,isAdult:false){
    id format seasonYear status title{english romaji}coverImage{large}
    relations{edges{relationType node{id type}}}}}}`;
  async function expandFranchise(root) {
    try {
      const collected = new Map();
      let frontier = (root.relations.edges || [])
        .filter(e => e.node.type === 'ANIME' && FR_TYPES.includes(e.relationType))
        .map(e => e.node.id);
      let hops = 0;
      while (frontier.length && collected.size < 14 && hops < 5) {
        const res = await fetch('https://graphql.anilist.co', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query: FR_Q, variables: { ids: frontier } })
        });
        if (!res.ok) return;
        const { data } = await res.json();
        const next = [];
        data.Page.media.forEach(md => {
          if (md.id === id || collected.has(md.id)) return;
          collected.set(md.id, md);
          (md.relations.edges || []).forEach(e => {
            if (e.node.type === 'ANIME' && (e.relationType === 'PREQUEL' || e.relationType === 'SEQUEL')
                && e.node.id !== id && !collected.has(e.node.id)) next.push(e.node.id);
          });
        });
        frontier = [...new Set(next)];
        hops++;
      }
      const row = document.getElementById('rel-row');
      if (!row || !collected.size) return;
      const list = [...collected.values()].sort((a, b) => (a.seasonYear || 9999) - (b.seasonYear || 9999));
      row.innerHTML = list.map(n => `
        <a class="rel-card" href="anime.html?id=${n.id}">
          <img src="${n.coverImage.large}" alt="" loading="lazy">
          <span class="rel-tag${n.status === 'NOT_YET_RELEASED' ? ' upcoming' : ''}">${n.status === 'NOT_YET_RELEASED' ? 'UPCOMING' : (n.format || '').replace(/_/g, ' ')}</span>
          <span class="rel-name">${n.title.english || n.title.romaji}</span>
          <span class="rel-meta">${n.status === 'NOT_YET_RELEASED' ? (n.seasonYear ? 'Coming ' + n.seasonYear : 'TBA') : (n.seasonYear || '')}</span>
        </a>`).join('');
    } catch (e) {}
  }

  // Click-to-play trailer facade (fast + avoids YouTube config errors)
  document.addEventListener('click', e => {
    const fac = e.target.closest('.trailer-embed[data-yt]');
    if (!fac) return;
    const vid = fac.dataset.yt;
    fac.removeAttribute('data-yt');
    fac.innerHTML = `<iframe src="https://www.youtube.com/embed/${vid}?autoplay=1&playsinline=1&rel=0&modestbranding=1"
      title="Trailer" frameborder="0" referrerpolicy="strict-origin-when-cross-origin"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      allowfullscreen></iframe>`;
  });
</script>
